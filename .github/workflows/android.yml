name: Android app

# Builds apps/android (the WebView shell around the site) and publishes MinimalERP.apk as a GitHub Release, so anyone can install it from
# https://github.com/MinimalERP/minimalERP/releases/latest/download/MinimalERP.apk. The site itself updates through Pages; this only runs
# when the shell changes.
on:
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore the release key
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Build the signed APK
        working-directory: apps/android
        run: gradle --no-daemon --stacktrace assembleRelease -PversionCode=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Publish the release
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk MinimalERP.apk
          gh release create "android-v${{ github.run_number }}" MinimalERP.apk --latest \
            --title "MinimalERP Android 1.${{ github.run_number }}" \
            --notes "Install on Android: open this page on the phone, download MinimalERP.apk, allow installing from this source. Log in with your usual MinimalERP account."
        env:
          GH_TOKEN: ${{ github.token }}
